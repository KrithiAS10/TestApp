apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: C:\ProgramData\chocolatey\lib\kubernetes-kompose\tools\kompose.exe convert
    kompose.version: 1.38.0 (a8f5d1cbd)
  labels:
    io.kompose.service: user-service
  name: user-service
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: user-service
  template:
    metadata:
      annotations:
        kompose.cmd: C:\ProgramData\chocolatey\lib\kubernetes-kompose\tools\kompose.exe convert
        kompose.version: 1.38.0 (a8f5d1cbd)
      labels:
        io.kompose.service: user-service
    spec:
      containers:
        - args:
            - npm
            - run
            - start
            - --workspace=backend/services/user
          env:
            - name: DATABASE_URL
              value: mongodb://mongodb:27017/userdb?replicaSet=rs0
            - name: JWT_SECRET
              value: supersecretkey
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://jaeger:4318
            - name: PORT
              value: "3001"
          image: user-service
          imagePullPolicy: Never
          name: user-service
      restartPolicy: Always
